name: High-Frequency Stock Data Collector

on:
  schedule:
    # מורץ אוטומטית כל 5 דקות בימים שני עד שישי (מקסימום תדירות ב-GitHub Actions)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # מאפשר גם הרצה ידנית בלחיצת כפתור מתי שתחפוץ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pytz

    - name: Run Data Collector
      run: python collector_script_new.py

    - name: Commit and Push Updated Database
      run: |
        git config --global user.name "Automation Bot"
        git config --global user.email "bot@github.com"
        
        # סנכרון חכם מול השרת למניעת התנגשויות דחיפה
        git fetch origin main
        git pull origin main --rebase || echo "No remote changes"
        
        git add stock_history_db.json
        git commit -m "Auto-update high-frequency stock database [skip ci]" || exit 0
        git push origin main